<!-- Sin bindings de eventos: todo se escucha desde el TS, fuera de Angular -->
<section
  #seccion
  tabindex="0"
  role="group"
  aria-label="Panorámica interactiva del mirador El Chillín. Arrastra o usa las flechas del teclado para recorrerla."
  class="relative h-[72vh] min-h-[520px] max-h-[760px] cursor-grab touch-pan-y select-none
         overflow-hidden bg-[var(--color-primary-dark)] focus-visible:outline-none"
>

  <!-- PANORAMA (más ancha que la sección; se desplaza dentro de ella) -->
  <div
    #pista
    class="pointer-events-none absolute inset-y-0 left-1/2 -ml-[95%] w-[190%]
           will-change-transform md:-ml-[80%] md:w-[160%]"
  >
    <img
      src="assets/INICIO/PANORAMICA_EXPLORA/panoramica_explora.jpeg"
      alt="Paisaje panorámico de Huaranchal desde el mirador El Chillín"
      draggable="false"
      class="h-full w-full object-cover"
    />
  </div>


  <!-- CONTRASTE -->
  <div class="pointer-events-none absolute inset-0 bg-linear-to-r from-[var(--color-primary-dark)]/85 via-[var(--color-primary-dark)]/35 to-transparent"></div>
  <div class="pointer-events-none absolute inset-0 bg-linear-to-t from-[var(--color-primary-dark)]/80 via-transparent to-[var(--color-primary-dark)]/10"></div>


  <!-- CONTENIDO -->
  <div class="pointer-events-none relative z-10 mx-auto flex h-full max-w-7xl items-center px-6 pb-24 sm:px-8 md:px-10 lg:px-12">

    <div class="max-w-2xl">

      <p class="flex items-center gap-4 text-[11px] font-semibold uppercase tracking-[0.3em] text-[var(--color-accent)]">
        <span class="h-px w-10 bg-[var(--color-accent)] sm:w-14"></span>
        Mirador El Chillín
      </p>

      <h2 class="mt-6 font-serif text-5xl leading-[1.02] text-white sm:text-6xl md:text-7xl">
        Mira Huaranchal
        <span class="block italic text-[var(--color-accent)]">desde lo alto</span>
      </h2>

      <p class="mt-6 max-w-xl text-sm leading-7 text-white/75 sm:text-base sm:leading-8">
        Recorre el paisaje de lado a lado: arrastra la imagen y suéltala
        para dejarla deslizar. Si no la tocas, ella sola te lleva de paseo.
      </p>

      <div class="mt-7 flex flex-wrap items-center gap-x-6 gap-y-3 text-xs font-medium text-white/65 sm:text-sm">
        <span class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-[var(--color-accent)]"></span>
          Valle Alto Chicama
        </span>

        <span class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-[var(--color-secondary)]"></span>
          Paisaje natural
        </span>
      </div>

    </div>
  </div>


  <!-- INSTRUMENTOS DEL MIRADOR -->
  <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 px-6 pb-6 sm:px-8 md:px-10 lg:px-12">
    <div class="mx-auto max-w-7xl">

      <div class="flex items-end justify-between gap-6 text-[11px] uppercase tracking-[0.25em] text-white/60">
        <span class="flex items-center gap-3">
          <span class="text-[var(--color-accent)]">←</span>
          <span class="hidden md:inline">Arrastra para recorrer</span>
          <span class="md:hidden">Desliza para recorrer</span>
          <span class="text-[var(--color-accent)]">→</span>
        </span>

        <span class="hidden text-white/40 md:inline">Raíces de Huaranchal</span>
      </div>

      <!-- Regla: se mueve con la imagen -->
      <div class="relative mt-4 h-4 overflow-hidden">
        <div #regla class="regla-mirador absolute inset-y-0"></div>

        <!-- Indicador fijo en el centro -->
        <span class="absolute left-1/2 top-0 h-0 w-0 -translate-x-1/2 border-x-4 border-t-[6px]
                     border-x-transparent border-t-[var(--color-accent)]"></span>
      </div>

      <!-- Posición dentro de la panorámica -->
      <div class="relative mt-3 h-px bg-white/20">
        <span
          #marcador
          class="absolute top-1/2 h-2 w-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[var(--color-accent)]"
          style="left: 50%"
        ></span>
      </div>

    </div>
  </div>

</section>
