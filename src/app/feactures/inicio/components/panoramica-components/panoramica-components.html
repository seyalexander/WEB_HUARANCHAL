```html
<section
  (mousemove)="onPanoramaMove($event)"
  (mouseleave)="onPanoramaLeave()"
  (touchstart)="onPanoramaTouchStart($event)"
  (touchmove)="onPanoramaTouchMove($event)"
  (touchend)="onPanoramaTouchEnd()"
  class="relative h-screen min-h-162.5 overflow-hidden bg-[#1E3A24] select-none"
>

  <!-- =========================================================
       PANORAMA
       ========================================================= -->

  <div
    class="absolute inset-0 flex items-center justify-center overflow-hidden pointer-events-none"
  >

    <img
      src="assets/INICIO/PANORAMICA_EXPLORA/panoramica_explora.jpeg"
      alt="Paisaje panorámico de Huaranchal"
      [style.transform]="'translate3d(' + translateX + 'px,0,0) scale(1.05)'"
      class="absolute h-full w-[220%] max-w-none object-cover will-change-transform select-none md:w-[180%]"
    />

  </div>


  <!-- =========================================================
       OVERLAY CINEMATOGRÁFICO
       ========================================================= -->

  <div
    class="absolute inset-0 bg-linear-to-r from-[#1E3A24]/95 via-[#1E3A24]/55 to-[#1E3A24]/10"
  ></div>

  <div
    class="absolute inset-0 bg-linear-to-t from-[#1E3A24]/70 via-transparent to-[#1E3A24]/20"
  ></div>


  <!-- =========================================================
       LUZ / AMBIENTE
       ========================================================= -->

  <div
    class="pointer-events-none absolute -left-32 top-10 h-80 w-80 rounded-full bg-[#F6C445]/10 blur-3xl md:left-10 md:top-20 md:h-96 md:w-96"
  ></div>

  <div
    class="pointer-events-none absolute -bottom-32 right-0 h-96 w-96 rounded-full bg-[#F28C28]/10 blur-3xl md:right-20"
  ></div>


  <!-- =========================================================
       CONTENIDO PRINCIPAL
       ========================================================= -->

  <div
    class="relative z-10 mx-auto flex h-full max-w-7xl items-center px-6 pointer-events-none sm:px-8 md:px-10 lg:px-12"
  >

    <div class="max-w-3xl pt-8 md:pt-0">

      <!-- ETIQUETA -->

      <div class="flex items-center gap-4">

        <div
          class="h-px w-10 bg-[#F6C445] sm:w-14"
        ></div>

        <span
          class="text-[10px] font-black uppercase tracking-[3px] text-[#F6C445] sm:text-xs"
        >
          Mirador El Chillín
        </span>

      </div>


      <!-- TÍTULO -->

      <h2
        class="mt-6 text-5xl font-black leading-[0.88] tracking-[-0.05em] text-white sm:text-6xl md:mt-8 md:text-7xl lg:text-8xl"
      >

        Explora

        <span
          class="mt-2 block text-[#F6C445]"
        >
          Huaranchal
        </span>

      </h2>


      <!-- DESCRIPCIÓN -->

      <p
        class="mt-7 max-w-2xl text-base leading-7 text-white/70 sm:text-lg sm:leading-8 md:mt-8"
      >
        Recorre con el cursor o desliza en tu pantalla para contemplar
        el paisaje natural de Huaranchal desde una perspectiva inmersiva.
      </p>


      <!-- INFORMACIÓN DE TERRITORIO -->

      <div
        class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-3 text-xs font-medium text-white/60 sm:text-sm"
      >

        <div class="flex items-center gap-2">

          <span
            class="h-2 w-2 rounded-full bg-[#F6C445]"
          ></span>

          <span>
            Valle Alto Chicama
          </span>

        </div>


        <div
          class="hidden h-4 w-px bg-white/20 sm:block"
        ></div>


        <div class="flex items-center gap-2">

          <span
            class="h-2 w-2 rounded-full bg-[#4F8A3F]"
          ></span>

          <span>
            Paisaje natural
          </span>

        </div>

      </div>


      <!-- INDICADOR MÓVIL -->

      <div
        class="mt-8 inline-flex items-center gap-3 rounded-full border border-white/10 bg-black/20 px-5 py-3 text-sm text-white backdrop-blur-xl md:hidden"
      >

        <span
          class="text-lg leading-none text-[#F6C445]"
        >
          ←
        </span>

        <span class="text-white/80">
          Desliza para explorar
        </span>

        <span
          class="text-lg leading-none text-[#F6C445]"
        >
          →
        </span>

      </div>

    </div>

  </div>


  <!-- =========================================================
       INDICADOR DESKTOP
       ========================================================= -->

  <div
    class="pointer-events-none absolute bottom-8 left-1/2 hidden -translate-x-1/2 md:block"
  >

    <div
      class="flex items-center gap-4 rounded-full border border-white/10 bg-[#1E293B]/30 px-5 py-2.5 text-xs font-medium tracking-wide text-white/70 backdrop-blur-xl"
    >

      <span class="text-[#F6C445]">
        ←
      </span>

      <span>
        Mueve el cursor para explorar
      </span>

      <span class="text-[#F6C445]">
        →
      </span>

    </div>

  </div>


  <!-- =========================================================
       MARCA DE SECCIÓN
       ========================================================= -->

  <div
    class="pointer-events-none absolute bottom-8 right-6 hidden text-right sm:right-8 md:block lg:right-12"
  >

    <span
      class="text-[9px] font-black uppercase tracking-[3px] text-white/40"
    >
      Raíces de Huaranchal
    </span>

  </div>

</section>
```
