<section class="relative overflow-hidden bg-[var(--color-primary-dark)] py-16 md:py-24">

    <!-- Textura de fondo -->
    <div
        class="pointer-events-none absolute inset-0 opacity-[0.04]
               bg-[radial-gradient(circle_at_center,var(--color-text-light)_1px,transparent_1px)]
               bg-[size:18px_18px]"
    ></div>

    <div class="relative mx-auto max-w-6xl px-6">

        <!-- Encabezado editorial -->
        <header class="mb-12 flex flex-col gap-4 md:mb-16 md:flex-row md:items-end md:justify-between">
            <div>
                <p class="text-xs uppercase tracking-[0.3em] text-white/50">Qué conocerás</p>
                <h2 class="mt-3 font-serif text-4xl leading-[1.05] text-white md:text-6xl">
                    Cuatro formas de<br />
                    <span class="italic text-white/60">perderte aquí</span>
                </h2>
            </div>
            <p class="max-w-xs text-sm leading-relaxed text-white/60">
                Escribe aquí una frase corta que resuma la esencia del lugar.
            </p>
        </header>

        <div class="grid grid-cols-1 items-start gap-5 sm:grid-cols-2 lg:grid-cols-4">

            @for (experiencia of experiencias; track experiencia.id) {

                <article
                    pAnimateOnScroll
                    [enterClass]="'animate-enter fade-in-10 ' + experiencia.animacion + ' animate-duration-1000'"
                    leaveClass="animate-leave fade-out-0"
                    class="group lg:even:mt-12"
                >
                    <a
                        [routerLink]="experiencia.routerLink"
                        class="relative flex h-96 flex-col justify-between overflow-hidden rounded-3xl
                               border border-white/10 p-5 lg:h-[30rem]"
                    >

                        <!-- Foto -->
                        <img
                            [src]="experiencia.imagen"
                            [alt]="experiencia.nombre"
                            loading="lazy"
                            class="absolute inset-0 h-full w-full object-cover
                                   transition-transform duration-700 group-hover:scale-110"
                        />

                        <!-- Degradado para legibilidad -->
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-black/20"></div>

                        <!-- Tinte del color de la experiencia al hacer hover -->
                        <div
                            class="absolute inset-0 opacity-0 transition-opacity duration-500 group-hover:opacity-100"
                            [style.background]="'linear-gradient(to top, ' + experiencia.color + '99, transparent 70%)'"
                        ></div>

                        <!-- Parte superior: número + icono -->
                        <div class="relative flex items-start justify-between">
                            <span
                                class="font-serif text-5xl font-light leading-none text-transparent
                                       [-webkit-text-stroke:1px_rgba(255,255,255,0.7)]"
                            >
                                {{ experiencia.numero }}
                            </span>

                            <span
                                class="flex h-11 w-11 items-center justify-center rounded-full
                                       border border-white/30 bg-black/30 backdrop-blur-sm"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="24" height="24" viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="white"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    @for (d of iconos[experiencia.svg]; track d) {
                                        <path [attr.d]="d" />
                                    }
                                </svg>
                            </span>
                        </div>

                        <!-- Parte inferior: textos -->
                        <div class="relative">
                            <p
                                class="text-[11px] font-medium uppercase tracking-[0.25em]"
                                [style.color]="experiencia.color"
                            >
                                {{ experiencia.etiqueta }}
                            </p>

                            <h3 class="mt-1 font-serif text-2xl text-white">
                                {{ experiencia.nombre }}
                            </h3>

                            <!-- Descripción: visible en móvil, se revela con hover en desktop -->
                            <div
                                class="grid grid-rows-[1fr] transition-[grid-template-rows] duration-500
                                       lg:grid-rows-[0fr] lg:group-hover:grid-rows-[1fr]
                                       lg:group-focus-within:grid-rows-[1fr]"
                            >
                                <div class="overflow-hidden">
                                    <p class="pt-3 text-sm leading-relaxed text-white/80">
                                        {{ experiencia.descripcion }}
                                    </p>
                                </div>
                            </div>

                            <div class="mt-4 flex items-center gap-2 text-xs uppercase tracking-widest text-white/70
                                        transition-all duration-300 group-hover:gap-4 group-hover:text-white">
                                Explorar <span aria-hidden="true">→</span>
                            </div>
                        </div>

                    </a>
                </article>
            }

        </div>
    </div>
</section>
