 <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-12 w-full">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <!-- IZQUIERDA -->
      <div>
        <h1 class="mt-8 text-5xl md:text-4xl lg:text-4xl font-black leading-none text-white">
          Descubre la magia de
          <span class="block  lg:text-8xl mt-3 text-[#F6C445]">
            Huaranchal
          </span>
        </h1>

        <p class="mt-8 text-lg md:text-xl text-white max-w-xl leading-relaxed">
          Explora cataratas escondidas, aguas termales naturales y
          paisajes únicos en el corazón del Alto Chicama.
        </p>

        <div class="mt-10 flex flex-wrap gap-4">
          <button [routerLink]="'/Lugares'" class="px-8 py-4 rounded-xl w-full lg:w-auto bg-[#F28C28] hover:bg-[#E67E22] text-white font-semibold shadow-2xl hover:scale-105 transition-all">
            Explorar destinos
          </button>
          <button class="px-8 py-4 rounded-xl border border-white/20 bg-white/10 w-full lg:w-auto backdrop-blur-md text-white hover:bg-white/20 transition-all">
            Cómo llegar
          </button>
        </div>

        <!-- Mini Stats -->
        <div class="mt-12 flex flex-wrap gap-8">
          <div>
            <h3 class="text-4xl font-bold text-[#F6C445]">
              4+
            </h3>
            <p class="text-slate-300">
              Destinos
            </p>
          </div>

          <div>
            <h3 class="text-4xl font-bold text-[#F6C445]">
              2500m
            </h3>
            <p class="text-slate-300">
              Altitud
            </p>
          </div>

          <div>
            <h3 class="text-4xl font-bold text-[#F6C445]">
              365
            </h3>

            <p class="text-slate-300">
              Días al año
            </p>
          </div>
        </div>
      </div>
    </div>

  </div>
