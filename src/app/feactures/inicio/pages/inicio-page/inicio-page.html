<section (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()"
  class="relative min-h-screen overflow-hidden flex items-center custom-hero">

  <!-- Fondo -->
  <img [style.transform]="'scale(1.1) translate(' + mouseX + 'px,' + mouseY + 'px)'" 
    src="assets/CTA-IMG.jpg" alt="Huaranchal" class="absolute inset-0 w-full h-full object-cover">

  <!-- Overlay cinematográfico -->
  <div class="absolute inset-0 bg-linear-to-r from-black/85 via-black/60 to-black/20">
  </div>

  <app-hero-inicio />

  @if(mostrarBrillo){
  <div class="mouse-light" [style.left.px]="cursorX" [style.top.px]="cursorY">
  </div>
  }

  <!-- Gradiente inferior -->
  <div class="absolute bottom-0 left-0 right-0 h-40 bg-linear-to-t from-slate-950 to-transparent">
  </div>

</section>

<app-que-conoceras-inicio-components />

<app-panoramica-components />

<app-productos-emblematicos-inicio-components />

<app-cta-inicio-components />

<app-footer-inicio-components />

@if(showScrollTop){
<button (click)="scrollToTop()" class="fixed bottom-6 right-6 z-50 w-14 h-14 flex items-center justify-center
         bg-orange-500 hover:bg-orange-600 rounded-full shadow-2xl
         transition-all duration-300 hover:scale-110">
  ↑
</button>
}
