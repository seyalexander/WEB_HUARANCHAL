<section
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
  class="relative min-h-screen overflow-hidden flex items-center custom-hero">

  <!-- Fondo -->
  <img
    [style.transform]="'scale(1.1) translate(' + mouseX + 'px,' + mouseY + 'px)'"
    src="assets/CTA-IMG.jpg"
    alt="Huaranchal"
    class="absolute inset-0 w-full h-full object-cover">

  <!-- Overlay cinematográfico -->
  <div class="absolute inset-0 bg-linear-to-r from-black/85 via-black/60 to-black/20">
  </div>

  <app-hero-inicio />

  @if(mostrarBrillo){
    <div
      class="mouse-light"
      [style.left.px]="cursorX"
      [style.top.px]="cursorY">
    </div>
  }

  <!-- Gradiente inferior -->
  <div class="absolute bottom-0 left-0 right-0 h-40 bg-linear-to-t from-slate-950 to-transparent">
  </div>

</section>


<app-que-conoceras-inicio-components />

<app-panoramica-components />

<app-productos-emblematicos-inicio-components />

<app-cta-inicio-components />

<app-footer-inicio-components />


<!-- ====================================================== -->
<!-- REPRODUCTOR DE MÚSICA -->
<!-- ====================================================== -->

<div class="fixed left-5 bottom-6 z-50">

  @if (!mostrarReproductor) {

    <!-- ================================================== -->
    <!-- BOTÓN PEQUEÑO -->
    <!-- ================================================== -->

    <button
      type="button"
      (click)="abrirReproductor()"
      aria-label="Abrir reproductor de música"
      class="group
             w-14 h-14
             flex items-center justify-center
             rounded-full
             bg-[#F6C445]
             hover:bg-[#d9ad35]
             text-white
             shadow-2xl
             transition-all
             duration-300
             hover:scale-110
             hover:shadow-[0_0_25px_rgba(246,196,69,0.45)]">

      <span
        class="text-2xl
               transition-transform
               duration-300
               group-hover:scale-110">

        <svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#ffffff"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
  <path d="M9 17v-13h10v7" />
  <path d="M9 8h10" />
  <path d="M18 22l3.35 -3.284a2.143 2.143 0 0 0 .005 -3.071a2.242 2.242 0 0 0 -3.129 -.006l-.224 .22l-.223 -.22a2.242 2.242 0 0 0 -3.128 -.006a2.143 2.143 0 0 0 -.006 3.071l3.355 3.296z" />
</svg>

      </span>

    </button>

  } @else {

    <!-- ================================================== -->
    <!-- REPRODUCTOR -->
    <!-- ================================================== -->

    <div
      class="relative
             w-[280px]
             sm:w-[320px]
             rounded-2xl
             bg-[#111113]/95
             backdrop-blur-xl
             border border-white/10
             shadow-[0_15px_50px_rgba(0,0,0,0.45)]
             text-white
             overflow-hidden">


      <!-- ================================================ -->
      <!-- DETALLE SUPERIOR -->
      <!-- ================================================ -->

      <div
        class="absolute
               top-0
               left-0
               right-0
               h-1
               bg-linear-to-r
               from-[#F6C445]
               to-[#E8A82F]">
      </div>


      <!-- ================================================ -->
      <!-- BOTÓN CERRAR -->
      <!-- ================================================ -->

      <button
        type="button"
        (click)="cerrarReproductor()"
        aria-label="Cerrar reproductor"
        class="absolute
               top-3
               right-3
               z-10
               w-8
               h-8
               rounded-full
               flex items-center justify-center
               bg-white/10
               hover:bg-white/20
               text-white
               text-lg
               transition-all
               duration-200
               hover:rotate-90">

        ×

      </button>


      <!-- ================================================ -->
      <!-- CONTENIDO -->
      <!-- ================================================ -->

      <div class="p-5 pt-6 pr-12">


        <!-- ============================================== -->
        <!-- INFORMACIÓN -->
        <!-- ============================================== -->

        <div class="flex items-center gap-3">

          <!-- ÍCONO -->
          <div
            class="w-12
                   h-12
                   shrink-0
                   rounded-full
                   bg-[#F6C445]
                   flex
                   items-center
                   justify-center
                   shadow-[0_0_20px_rgba(246,196,69,0.25)]">

            <span
              class="text-xl
                     filter
                     drop-shadow-sm">

              <svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#ffffff"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
  <path d="M9 17v-13h10v7" />
  <path d="M9 8h10" />
  <path d="M18 22l3.35 -3.284a2.143 2.143 0 0 0 .005 -3.071a2.242 2.242 0 0 0 -3.129 -.006l-.224 .22l-.223 -.22a2.242 2.242 0 0 0 -3.128 -.006a2.143 2.143 0 0 0 -.006 3.071l3.355 3.296z" />
</svg>

            </span>

          </div>


          <!-- TEXTO -->
          <div class="min-w-0">

            <p
              class="font-semibold
                     text-sm
                     truncate">

              Música de Huaranchal

            </p>

            <p
              class="text-xs
                     text-white/50
                     mt-0.5
                     truncate">

              Sonidos de nuestra tierra

            </p>

          </div>

        </div>


        <!-- ============================================== -->
        <!-- CONTROLES -->
        <!-- ============================================== -->

        <div
          class="flex
                 items-center
                 gap-3
                 mt-5">


          <!-- PLAY / PAUSE -->
          <button
            type="button"
            (click)="alternarMusica()"
            [attr.aria-label]="
              musicaReproduciendo
                ? 'Pausar música'
                : 'Reproducir música'
            "
            class="w-10
                   h-10
                   shrink-0
                   rounded-full
                   bg-[#F6C445]
                   hover:bg-[#d9ad35]
                   text-[#171717]
                   flex
                   items-center
                   justify-center
                   font-bold
                   transition-all
                   duration-200
                   hover:scale-105
                   shadow-lg">

            @if (musicaReproduciendo) {

              <span class="text-sm">
                <svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 24 24"
  fill="#fff"
>
  <path d="M9 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z" />
  <path d="M17 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z" />
</svg>
              </span>

            } @else {

              <span class="text-sm ml-0.5">
                <svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 24 24"
  fill="#fff"
>
  <path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" />
</svg>
              </span>

            }

          </button>


          <!-- ============================================ -->
          <!-- BARRA DE REPRODUCCIÓN -->
          <!-- ============================================ -->

          <div class="flex-1">

            <div
              class="h-1.5
                     rounded-full
                     bg-white/10
                     overflow-hidden">

              @if (musicaReproduciendo) {

                <div
                  class="h-full
                         w-1/3
                         bg-[#F6C445]
                         rounded-full
                         animate-pulse">
                </div>

              }

            </div>

          </div>


          <!-- ONDA -->
          @if (musicaReproduciendo) {

            <div
              class="flex
                     items-end
                     gap-[2px]
                     h-5">

              <span
                class="w-[2px]
                       h-2
                       bg-[#F6C445]
                       rounded-full
                       animate-pulse">
              </span>

              <span
                class="w-[2px]
                       h-4
                       bg-[#F6C445]
                       rounded-full
                       animate-pulse">
              </span>

              <span
                class="w-[2px]
                       h-3
                       bg-[#F6C445]
                       rounded-full
                       animate-pulse">
              </span>

              <span
                class="w-[2px]
                       h-5
                       bg-[#F6C445]
                       rounded-full
                       animate-pulse">
              </span>

            </div>

          }

        </div>

      </div>

    </div>

  }

</div>

<!-- ====================================================== -->
<!-- SCROLL TOP -->
<!-- ====================================================== -->

@if(showScrollTop){

  <button
    (click)="scrollToTop()"
    class="fixed bottom-6 right-6 z-50
           w-14 h-14
           flex items-center justify-center
           bg-orange-500
           hover:bg-orange-600
           rounded-full
           shadow-2xl
           transition-all
           duration-300
           hover:scale-110">

    ↑

  </button>

}
